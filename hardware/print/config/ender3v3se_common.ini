# Creality Ender-3 V3 SE（キカイノイエ）の共通設定。PrusaSlicer 2.7 用
# 機械の値は Cura の公式の定義（creality_ender3v3se.def.json）から：台 220×220、高さ 250、引き戻し 0.8mm・40mm/s
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
use_relative_e_distances = 0
retract_length = 0.8
retract_speed = 40
retract_lift = 0.2
machine_max_acceleration_x = 2500
machine_max_acceleration_y = 2500
machine_max_acceleration_z = 500
machine_max_acceleration_e = 2500
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 30
machine_max_feedrate_e = 100
machine_limits_usage = emit_to_gcode
start_gcode = M220 S100 ;Reset Feedrate\nM221 S100 ;Reset Flowrate\nG28 ;Home\nM420 S1 ;Use saved mesh leveling data\nG92 E0\nG1 Z2.0 F3000\nG1 X-3 Y20 Z0.28 F5000.0\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 X-3 Y100.0 Z0.28 F1500.0 E15\nG1 X-2 Y100.0 Z0.28 F5000.0\nG1 X-2 Y20 Z0.28 F1500.0 E30\nG92 E0\nG1 E-1.0000 F1800\nG1 Z2.0 F3000\nG1 E0.0000 F1800
end_gcode = G91 ;Relative positioning\nG1 E-2 F2700 ;Retract a bit\nG1 E-2 Z0.2 F2400 ;Retract and raise Z\nG1 X5 Y5 F3000 ;Wipe out\nG1 Z10 ;Raise Z more\nG90 ;Absolute positioning\nG1 X0 Y220 ;Present print\nM106 S0 ;Turn-off fan\nM104 S0 ;Turn-off hotend\nM140 S0 ;Turn-off bed\nM84 X Y E ;Disable all steppers but Z
first_layer_height = 0.2
first_layer_speed = 30
skirts = 1
skirt_distance = 4
skirt_height = 1
support_material = 0
fill_pattern = grid
top_solid_layers = 5
bottom_solid_layers = 4
seam_position = rear
gcode_comments = 0
gcode_label_objects = octoprint
gcode_resolution = 0.05
resolution = 0.02

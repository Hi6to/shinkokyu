<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シン呼吸 煙の画面</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3a4048;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; color: #f4f6f8; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #indicator { position: fixed; top: 16px; left: 16px; width: 40px; height: 40px; cursor: pointer; border: none; padding: 0; background: none; }
  #indicator svg { width: 40px; height: 40px; }

  #hud { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #timer { font-size: 64px; font-weight: 500; font-variant-numeric: tabular-nums; height: 78px; opacity: 0;
    transition: opacity .4s; text-shadow: 0 2px 16px rgba(20, 28, 38, .65); }
  #timer.on { opacity: 1; }
  #hint { font-size: 16px; display: inline-block; padding: 6px 16px; border-radius: 18px; background: rgba(28, 38, 50, .45); transition: opacity .6s; }
  #bar { width: min(460px, 70vw); height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); margin: 12px auto 0; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: rgba(255,255,255,.9); }

  #banner, #done { position: fixed; left: 50%; transform: translateX(-50%); text-align: center;
    background: rgba(28, 38, 50, .7); backdrop-filter: blur(6px); border-radius: 18px; padding: 18px 30px; transition: opacity .8s; }
  #banner { top: 24px; font-size: 18px; }
  #banner button { margin-left: 16px; }
  #done { top: 36%; transform: translate(-50%, -50%); font-size: 20px; min-width: 320px;
    background: rgba(255, 255, 255, .3); color: #1f2a36; }
  #done .big { font-size: clamp(26px, 4vw, 44px); font-weight: 700; margin-bottom: 8px; white-space: nowrap; }
  #done .note { font-size: 16px; margin-top: 10px; }
  .hidden { opacity: 0; pointer-events: none; }

  #gear { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 20px; border: none;
    background: rgba(28, 38, 50, .5); color: #fff; font-size: 20px; cursor: pointer; }
  #panel { position: fixed; top: 64px; right: 16px; width: 300px; max-height: calc(100vh - 90px); overflow: auto;
    background: rgba(28, 38, 50, .9); backdrop-filter: blur(8px); border-radius: 14px; padding: 16px; font-size: 14px; transition: opacity .3s; }
  #panel h2 { font-size: 13px; font-weight: 600; opacity: .7; margin: 14px 0 6px; }
  #panel h2:first-child { margin-top: 0; }
  #panel .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.ui, select, input { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: #fff; padding: 6px 10px; }
  button.ui { cursor: pointer; }
  button.ui:hover { background: rgba(255,255,255,.16); }
  select option { color: #000; }
  input { flex: 1; min-width: 0; }
  #devices { margin: 6px 0 0; padding-left: 18px; opacity: .85; }
  #panel .note { opacity: .65; font-size: 12px; line-height: 1.6; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<button id="indicator" title="煙のたまり具合（押すと、煙の表示を消す・出す）" aria-label="煙のたまり具合">
  <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
    <circle id="ind-arc" cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="3"
      stroke-linecap="round" transform="rotate(-90 20 20)" stroke-dasharray="0 100.5"/></svg>
</button>

<div id="banner" class="hidden">そろそろ一服しませんか <button class="ui" id="later">あとで</button></div>
<div id="done" class="hidden"></div>

<div id="hud">
  <div id="timer">0.0 秒</div>
  <div id="hint">本体に息を吹きこむと、音が鳴るたびに煙がひとつ消えます</div>
  <div id="bar"><div></div></div>
</div>

<button id="gear" title="設定（H キー）" aria-label="設定">⚙</button>
<div id="panel" class="hidden">
  <h2>本体</h2>
  <div class="row"><button class="ui" id="connect">本体をつなぐ</button></div>
  <ul id="devices"></ul>
  <div class="note">本体がなくても、<b>スペースキーを押している間</b>を「吹いている」として試せます。</div>

  <h2>煙がたまる速さ（いっぱいになるまで）</h2>
  <div class="row">
    <select id="fill">
      <option value="0.5">30秒（発表用）</option>
      <option value="5">5分</option>
      <option value="60" selected>60分</option>
      <option value="90">90分</option>
    </select>
    <button class="ui" id="full">いっぱいにする</button>
    <button class="ui" id="clear">空にする</button>
  </div>
  <div class="note">いっぱいのとき、煙のかたまりは曲の音の数×3（アメイジング・グレイスで96個）。「いっぱいにする」を押すと、本体の曲も最初に戻る。</div>

  <h2>もやもや（煙のかたまりに書く）</h2>
  <div class="row"><input id="moya" placeholder="例：急な残業" maxlength="12"><button class="ui" id="addmoya">煙にする</button></div>
  <div class="note">言葉の付いた煙は、曲の途中と最後の音で消える。文字は保存しない。</div>

  <h2>キー</h2>
  <div class="note">スペース：吹く（試す）／ F：全画面／ H：この設定を出す・しまう</div>
</div>

<script type="module">
import { ShinkokyuDevice, bluetoothAvailable } from './device.js';

const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const approach = (x, target, rate, dt) => x + (target - x) * (1 - Math.exp(-rate * dt));
const NOTE_NUM = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midiOf(name) {
  let n = NOTE_NUM[name[0]], i = 1;
  while (name[i] === '#' || name[i] === 'b') { n += name[i] === '#' ? 1 : -1; i++; }
  return n + 12 * (parseInt(name.slice(i), 10) + 1);
}

// ---------------- 曲：いま何音目か ----------------
class SongTracker {
  constructor(song) { this.setSong(song); }
  setSong(song) {
    this.song = song;
    this.flat = [];
    let b = 0;
    song.phrases.forEach((ph, pi) => ph.forEach(([name, beats], ni) => { this.flat.push({ pi, ni, start: b, beats, midi: midiOf(name) }); b += beats; }));
    this.total = b;
    this.reset();
  }
  reset() { this.idx = 0; this.elapsed = 0; this.done = false; }
  progress() {
    if (this.done) return 1;
    const n = this.flat[this.idx];
    return (n.start + Math.min(this.elapsed, n.beats)) / this.total;
  }
  // 本体の位置（1から数える）に合わせる
  syncTo(phrase, note, waiting) {
    if (waiting && phrase === this.song.phrases.length) { this.done = true; return; }
    const i = this.flat.findIndex((f) => f.pi === phrase - 1 && f.ni === note - 1);
    if (i < 0) return;
    if (i !== this.idx || this.done) { this.idx = i; this.elapsed = 0; this.done = false; }
  }
  // 吹いている間だけ進める。own=true なら音も自分で進める（キーボードで試すとき）
  // 戻り値：'note'（次の音へ）/ 'done'（曲の終わり）/ null
  advance(dt, exhaling, own) {
    if (!exhaling || this.done) return null;
    this.elapsed += dt * this.song.bpm / 60;
    if (!own) return null;
    let ev = null;
    while (this.elapsed >= this.flat[this.idx].beats) {
      this.elapsed -= this.flat[this.idx].beats;
      if (this.idx === this.flat.length - 1) { this.elapsed = this.flat[this.idx].beats; this.done = true; return 'done'; }
      this.idx++;
      ev = 'note';
    }
    return ev;
  }
}
const songCache = {};
async function loadSong(id) {
  if (!songCache[id]) songCache[id] = await (await fetch(`../songs/${id}.json`)).json();
  return songCache[id];
}
const tracker = new SongTracker(await loadSong('amazing_grace'));
const PER_NOTE = 3; // 1音で消えるかたまりの数（11/05 Hi6to：もっとたくさん消えたほうが気持ちいい）
const MAXP = () => tracker.flat.length * PER_NOTE; // いっぱいのときの煙のかたまりの数

// ---------------- 状態 ----------------
const st = {
  acc: 0.6,            // 作業でたまった煙（0〜1）
  fillMin: 60,         // いっぱいになるまでの分
  fogVisible: true,
  exhaling: false,
  strength: 0.8,       // 息の強さ（0〜1）
  source: 'keys',      // 'keys' か 'device'
  breathStart: 0,
  breaths: [],         // この一服の、吐く息の長さ（秒）
  lastBreathAt: 0,
  notifiedFull: false,
  holdClearUntil: 0,   // 1曲吹き終えたあと、晴れた空を見せておく時刻
  // この一服で消した数の管理
  sessionP: 0,         // 一服を始めたときの、かたまりの数
  sessionL: 0,         // そのうち、言葉の付いたかたまりの数
  poppedIdx: -1,       // どの音まで、かたまりを消したか
};
const view = { clear: 0, wind: 0, bloom: 0 };

// ---------------- WebGL：空（曇り空 → 青空と朝日） ----------------
const gl = $('gl').getContext('webgl', { antialias: false });
const GL_SCALE = 0.5;
const VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
const FS = `
precision highp float;
uniform vec2 uRes; uniform float uTime, uClear, uBloom;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float asp = uRes.x / uRes.y;
  vec2 p = vec2((uv.x - 0.5)*asp, uv.y);
  vec3 grey = mix(vec3(0.27, 0.30, 0.35), vec3(0.47, 0.50, 0.55), uv.y);
  vec3 sky = mix(vec3(1.00, 0.78, 0.56), vec3(0.20, 0.50, 0.88), smoothstep(0.0, 0.9, uv.y));
  sky = mix(sky, vec3(0.52, 0.77, 0.98), 0.25*smoothstep(0.3, 1.0, uv.y));
  vec2 sp = vec2(0.0, 0.26);
  float sd = length(p - sp);
  float ang = atan(p.y - sp.y, p.x - sp.x);
  float rays = pow(max(0.0, sin(ang*9.0 + uTime*0.12)), 8.0) + 0.7*pow(max(0.0, sin(ang*14.0 - uTime*0.09)), 10.0);
  float sunAmt = smoothstep(0.35, 1.0, uClear);
  vec3 sun = vec3(1.0, 0.92, 0.76) * (exp(-sd*12.0)*0.9 + exp(-sd*2.6)*0.30 + rays*exp(-sd*1.3)*0.30) * (sunAmt + 1.3*uBloom);
  gl_FragColor = vec4(mix(grey, sky, uClear) + sun, 1.0);
}`;
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uRes', 'uTime', 'uClear', 'uBloom']) U[n] = gl.getUniformLocation(prog, n);

// ---------------- 2D ----------------
const fx = $('fx').getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  $('gl').width = Math.round(W * GL_SCALE); $('gl').height = Math.round(H * GL_SCALE);
  gl.viewport(0, 0, $('gl').width, $('gl').height);
  DPR = Math.min(2, devicePixelRatio || 1);
  $('fx').width = Math.round(W * DPR); $('fx').height = Math.round(H * DPR);
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();
const ORIGIN = () => [W / 2, H * 1.08]; // 息が入ってくる所（画面の下のまん中）

// ---------------- 煙のかたまり ----------------
// 1つずつ形を決めて絵にしておき、変形させない（漂うだけ）
function makePuffImage(r) {
  const s = Math.ceil(r * 2.8 * DPR);
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  x.scale(DPR, DPR);
  const cx = r * 1.4, cy = r * 1.4;
  // 小さなぼかしをたくさん、横長に不ぞろいに重ねる（綿ではなく、半透明の煙に見えるように）
  const blobs = [];
  const n = 14 + ((Math.random() * 8) | 0);
  const tilt = (Math.random() - 0.5) * 0.6;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = r * 0.62 * Math.pow(Math.random(), 0.7);
    const px = Math.cos(a) * d * 1.45, py = Math.sin(a) * d * 0.62;
    blobs.push({ x: cx + px + py * tilt, y: cy + py, rr: r * (0.2 + Math.random() * 0.32) });
  }
  for (const b of blobs) { // 下側の淡い影
    const g = x.createRadialGradient(b.x, b.y + b.rr * 0.35, 0, b.x, b.y + b.rr * 0.35, b.rr * 1.2);
    g.addColorStop(0, 'rgba(92,100,116,0.16)'); g.addColorStop(1, 'rgba(92,100,116,0)');
    x.fillStyle = g; x.beginPath(); x.arc(b.x, b.y + b.rr * 0.35, b.rr * 1.2, 0, 7); x.fill();
  }
  for (const b of blobs) { // 上から光の当たった本体（中心でも半透明）
    const g = x.createRadialGradient(b.x - b.rr * 0.2, b.y - b.rr * 0.3, 0, b.x, b.y, b.rr * 1.15);
    g.addColorStop(0, 'rgba(244,246,250,0.42)'); g.addColorStop(0.5, 'rgba(216,221,230,0.24)'); g.addColorStop(1, 'rgba(196,203,215,0)');
    x.fillStyle = g; x.beginPath(); x.arc(b.x, b.y, b.rr * 1.15, 0, 7); x.fill();
  }
  return c;
}
const wispImg = makePuffImage(40);

const puffs = [];   // 見えている煙のかたまり
const bursts = [];  // はじけている途中
const wisps = [];   // はじけて散る小さな煙
const sparks = [], rings = [], streaks = [];

function baseR() { return Math.min(W, H) * (0.065 + Math.random() * 0.035); }
// ほかのかたまりとなるべく重ならない場所を探す
function findSpot(r, central = false) {
  let best = null, bestD = -Infinity;
  for (let i = 0; i < 24; i++) {
    const x = central ? W * (0.25 + Math.random() * 0.5) : W * (0.07 + Math.random() * 0.86);
    const y = central ? H * (0.22 + Math.random() * 0.3) : H * (0.12 + Math.random() * 0.6);
    let d = 1e9;
    for (const p of puffs) d = Math.min(d, Math.hypot(p.x - x, p.y - y) - p.r);
    if (d > bestD) { bestD = d; best = [x, y]; }
  }
  return best;
}
function addPuff(label = null) {
  const r = label ? Math.min(W, H) * 0.14 : baseR();
  const [x, y] = findSpot(r, !!label);
  const p = { x, y, r, label, img: makePuffImage(r), ph: Math.random() * 6, born: performance.now(), vx: (Math.random() - 0.5) * 4 };
  puffs.push(p);
  return p;
}
function setLabel(p, label) {
  p.label = label; p.r = Math.min(W, H) * 0.14; p.img = makePuffImage(p.r); p.born = performance.now() - 600;
  puffs.splice(puffs.indexOf(p), 1);
  [p.x, p.y] = findSpot(p.r, true); // 画面の上半分の中ほどへ置き直す
  puffs.push(p);
}

// 息の入る所に近いものから消す。言葉の付いたかたまりは、一服の途中と最後の音で消す
function chooseToPop() {
  const [ox, oy] = ORIGIN();
  const dist = (p) => Math.hypot(p.x - ox, p.y - oy);
  const alive = puffs.filter((p) => !p.doomed);
  const labeled = alive.filter((p) => p.label), plain = alive.filter((p) => !p.label);
  const L = labeled.length, R = alive.length;
  const spacing = Math.max(1, st.sessionP / Math.max(1, st.sessionL));
  const pick = (arr) => arr.reduce((a, b) => (dist(a) < dist(b) ? a : b));
  if (L > 0 && (R <= (L - 1) * spacing + 1 || plain.length === 0)) return pick(labeled);
  return plain.length ? pick(plain) : null;
}

function pop(p) {
  puffs.splice(puffs.indexOf(p), 1);
  bursts.push({ ...p, t: 0 });
  const [ox, oy] = ORIGIN();
  const dx = p.x - ox, dy = p.y - oy, d = Math.hypot(dx, dy) || 1;
  // はじけて散る小さな煙（息の向きに流れる）
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, s = 260 + Math.random() * 320;
    wisps.push({ x: p.x + Math.cos(a) * p.r * 0.4, y: p.y + Math.sin(a) * p.r * 0.3,
      vx: Math.cos(a) * s + dx / d * 220, vy: Math.sin(a) * s * 0.7 + dy / d * 220 - 40,
      s: 0.25 + Math.random() * 0.35, t: 0, life: 0.3 + Math.random() * 0.25 });
  }
  burst(p.x, p.y, dx / d, dy / d, p.label ? 46 : 14, p.label ? 640 : 560);
}
function burst(x, y, dx, dy, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 2.4;
    const s = speed * (0.35 + Math.random());
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.4, t: 0, r: 1.5 + Math.random() * 2.2 });
  }
  rings.push({ x, y, t: 0 });
}

// idx 番目の音（0から数える）が鳴ったら、その分だけかたまりを消す
function popTo(idx) {
  if (idx <= st.poppedIdx) return;
  const N = tracker.flat.length;
  const remainTarget = st.sessionP - Math.ceil(st.sessionP * (idx + 1) / N);
  let k = 0;
  while (puffs.filter((p) => !p.doomed).length > Math.max(0, remainTarget)) {
    const p = chooseToPop();
    if (!p) break;
    p.doomed = true; // 続けてポポポとはじけさせる
    setTimeout(() => { if (puffs.includes(p)) pop(p); }, k++ * 45);
  }
  st.poppedIdx = idx;
}

// ---------------- 毎こま ----------------
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  const inSession = st.poppedIdx >= 0 || st.exhaling;

  // 作業中は煙がたまる（一服の間・吹いた直後の20秒・晴れた空を見せている間はためない）
  const resting = inSession || t - st.lastBreathAt < 20000 || t < st.holdClearUntil;
  if (!resting) st.acc = Math.min(1, st.acc + dt / (st.fillMin * 60));
  if (st.acc >= 1 && !st.notifiedFull) { st.notifiedFull = true; $('banner').classList.remove('hidden'); }
  const want = Math.round(MAXP() * st.acc);
  if (!inSession && t >= st.holdClearUntil) {
    for (let i = 0; i < 3 && puffs.length < want; i++) addPuff();
  }

  // 曲を進める（キーボードのときは、ここで音を進めて、かたまりを消す）
  const ev = tracker.advance(dt, st.exhaling, st.source === 'keys');
  if (ev === 'note') popTo(tracker.idx);
  if (ev === 'done') onSongDone();

  view.clear = approach(view.clear, 1 - puffs.length / MAXP(), 3, dt);
  view.wind = approach(view.wind, st.exhaling ? st.strength : 0, st.exhaling ? 6 : 2, dt);
  view.bloom = approach(view.bloom, 0, 0.5, dt);

  gl.uniform2f(U.uRes, $('gl').width, $('gl').height);
  gl.uniform1f(U.uTime, t / 1000);
  gl.uniform1f(U.uClear, st.fogVisible ? view.clear : 1);
  gl.uniform1f(U.uBloom, view.bloom);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  draw(t, dt);

  $('ind-arc').setAttribute('stroke-dasharray', `${(100.5 * puffs.length / MAXP()).toFixed(1)} 100.5`);
  $('bar').firstElementChild.style.width = (tracker.progress() * 100).toFixed(1) + '%';
  if (st.exhaling) $('timer').textContent = ((t - st.breathStart) / 1000).toFixed(1) + ' 秒';
  requestAnimationFrame(frame);
}

function draw(t, dt) {
  fx.clearRect(0, 0, W, H);
  const [ox, oy] = ORIGIN();
  if (st.fogVisible) {
    // かたまり：漂うだけ（形は変えない）。吹いている間は、息の入る所から少し押しやられる
    for (const p of puffs) {
      p.ph += dt * 0.35;
      p.x += (p.vx + Math.sin(p.ph) * 4) * dt;
      p.y += Math.cos(p.ph * 0.8) * 3 * dt;
      if (view.wind > 0.01 && !p.label) { // 言葉の付いたかたまりは、読めるようにその場にとどめる
        const dx = p.x - ox, dy = p.y - oy, d = Math.hypot(dx, dy) || 1;
        p.x += dx / d * 7 * view.wind * dt; p.y += dy / d * 7 * view.wind * dt;
      }
      p.x = clamp(p.x, W * 0.02, W * 0.98); p.y = clamp(p.y, H * 0.04, H * 0.8);
    }
    const sorted = [...puffs].sort((a, b) => a.y - b.y);
    for (const p of sorted) {
      const k = clamp((t - p.born) / 1000, 0, 1);
      const sc = 0.7 + 0.3 * k;
      fx.globalAlpha = k;
      const s = p.r * 2.8 * sc;
      fx.drawImage(p.img, p.x - s / 2, p.y - s / 2, s, s);
      if (p.label) drawLabel(p.label, p.x, p.y, k, 1);
    }
    // はじける：ふくらみながら消える
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.t += dt;
      const k = b.t / 0.18;
      if (k >= 1) { bursts.splice(i, 1); continue; }
      const sc = 1 + 0.55 * (1 - (1 - k) * (1 - k) * (1 - k));
      fx.globalAlpha = 1 - k;
      const s = b.r * 2.8 * sc;
      fx.drawImage(b.img, b.x - s / 2, b.y - s / 2, s, s);
      if (b.label) drawLabel(b.label, b.x, b.y - 30 * k, 1 - k, 1 + 0.3 * k);
    }
    // 散る小さな煙
    for (let i = wisps.length - 1; i >= 0; i--) {
      const w = wisps[i];
      w.t += dt; w.x += w.vx * dt; w.y += w.vy * dt; w.vx *= 0.93; w.vy *= 0.93;
      if (w.t > w.life) { wisps.splice(i, 1); continue; }
      const k = w.t / w.life;
      fx.globalAlpha = 0.7 * (1 - k);
      const s = 40 * 2.8 * w.s * (1 + 0.6 * k);
      fx.drawImage(wispImg, w.x - s / 2, w.y - s / 2, s, s);
    }
    fx.globalAlpha = 1;
  }

  fx.globalCompositeOperation = 'lighter';
  // 風の筋：吹いている間、下のまん中から上へ走る
  const n = st.exhaling ? Math.round(1 + view.wind * 3) : 0;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.1;
    const s = (700 + Math.random() * 600) * (0.5 + view.wind);
    streaks.push({ x: W * (0.5 + (Math.random() - 0.5) * 0.18), y: H + 10, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      len: 60 + Math.random() * 120, t: 0, life: 0.6 + Math.random() * 0.5, a: 0.1 + Math.random() * 0.16 });
  }
  fx.lineCap = 'round';
  for (let i = streaks.length - 1; i >= 0; i--) {
    const s = streaks[i];
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > s.life || s.y < -200) { streaks.splice(i, 1); continue; }
    const k = 1 - s.t / s.life, sp = Math.hypot(s.vx, s.vy);
    const ex = s.x - s.vx / sp * s.len, ey = s.y - s.vy / sp * s.len;
    const g = fx.createLinearGradient(s.x, s.y, ex, ey);
    g.addColorStop(0, `rgba(255,255,255,${s.a * k})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    fx.strokeStyle = g; fx.lineWidth = 2;
    fx.beginPath(); fx.moveTo(s.x, s.y); fx.lineTo(ex, ey); fx.stroke();
  }
  // 光の粒
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.vy -= 20 * dt;
    if (p.t > p.life) { sparks.splice(i, 1); continue; }
    const k = 1 - p.t / p.life;
    fx.fillStyle = `rgba(255,244,220,${0.16 * k})`; fx.beginPath(); fx.arc(p.x, p.y, p.r * 4, 0, 7); fx.fill();
    fx.fillStyle = `rgba(255,255,255,${0.85 * k})`; fx.beginPath(); fx.arc(p.x, p.y, p.r, 0, 7); fx.fill();
  }
  // ぽっ：広がる輪
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.t += dt;
    if (r.t > 0.3) { rings.splice(i, 1); continue; }
    const k = r.t / 0.3;
    fx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - k)})`; fx.lineWidth = 3 * (1 - k) + 0.5;
    fx.beginPath(); fx.arc(r.x, r.y, 20 + 80 * k, 0, 7); fx.stroke();
  }
  fx.globalCompositeOperation = 'source-over';
}

function drawLabel(text, x, y, alpha, scale) {
  fx.save();
  fx.globalAlpha = alpha;
  fx.translate(x, y); fx.scale(scale, scale);
  fx.font = `700 ${Math.round(Math.min(W, H) * 0.036)}px system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif`;
  fx.shadowColor = 'rgba(255,255,255,0.9)'; fx.shadowBlur = 10;
  fx.textAlign = 'center'; fx.textBaseline = 'middle';
  fx.fillStyle = 'rgba(44, 52, 66, 0.9)';
  fx.fillText(text, 0, 0);
  fx.restore();
}

// ---------------- 息 ----------------
function startSessionIfNeeded() {
  if (st.poppedIdx >= 0 || tracker.progress() > 0) return;
  st.sessionP = puffs.length;
  st.sessionL = puffs.filter((p) => p.label).length;
  st.breaths = [];
}
function breathStart() {
  if (st.exhaling) return;
  const t = performance.now();
  if (st.holdClearUntil) hideDone();
  if (tracker.done && st.source === 'keys') { tracker.reset(); st.poppedIdx = -1; }
  startSessionIfNeeded();
  st.exhaling = true; st.breathStart = t;
  $('timer').classList.add('on');
  $('banner').classList.add('hidden');
  $('hint').style.opacity = 0;
  if (st.source === 'keys' && !tracker.done) popTo(tracker.idx); // 1つ目の音（または次の音）が鳴り始めた
}
function breathEnd(seconds) {
  if (!st.exhaling) return;
  st.exhaling = false;
  const t = performance.now();
  st.lastBreathAt = t;
  const sec = seconds ?? (t - st.breathStart) / 1000;
  if (sec >= 0.5) st.breaths.push(sec);
  setTimeout(() => { if (!st.exhaling) $('timer').classList.remove('on'); }, 1500);
}

function onSongDone() {
  if (st.holdClearUntil) return;
  // 残りがあれば、続けてポポポと消す
  const rest = [...puffs];
  rest.forEach((p, i) => setTimeout(() => { if (puffs.includes(p)) pop(p); }, i * 70));
  const b = st.exhaling ? [...st.breaths, (performance.now() - st.breathStart) / 1000] : st.breaths;
  // 作業に戻る人を送り出す言葉（クリアや点数ではない。ゲームではないので）
  const [m1, m2] = sendOff();
  let html = `<div class="big">${m1}</div><div>${m2}</div>`;
  if (b.length >= 2) {
    const k = Math.max(1, Math.min(3, Math.floor(b.length / 2)));
    const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const first = avg(b.slice(0, k)), last = avg(b.slice(-k));
    if (last > first + 0.2) html += `<div class="note">息が ${first.toFixed(1)}秒 → ${last.toFixed(1)}秒 にのびました</div>`;
  }
  $('done').innerHTML = html;
  setTimeout(() => $('done').classList.remove('hidden'), 500);
  st.holdClearUntil = performance.now() + 12000;
  view.bloom = 1;
  for (let i = 0; i < 12; i++) {
    setTimeout(() => { const x = W * (0.1 + Math.random() * 0.8), y = H * (0.15 + Math.random() * 0.55); burst(x, y, 0, -1, 34, 480); }, 300 + i * 90);
  }
  st.acc = 0;
  $('banner').classList.add('hidden');
  st.notifiedFull = false;
  setTimeout(() => { if (st.holdClearUntil) hideDone(); }, 12000);
}
function sendOff() {
  const h = new Date().getHours();
  const list = h < 11 ? [['いい一服でした', 'いってらっしゃい'], ['すっきり、晴れました', 'きょうも ゆっくりいこう']]
    : h < 17 ? [['すっきり、晴れました', 'つづきも ゆっくりいこう'], ['深呼吸、おつかれさま', '肩の力をぬいて、つづきへ']]
    : [['おつかれさまです', 'あと少し、ゆっくりいこう'], ['深呼吸、おつかれさま', 'むりせず、つづきへ']];
  return list[(Math.random() * list.length) | 0];
}
function hideDone() {
  $('done').classList.add('hidden');
  $('hint').style.opacity = 1;
  st.holdClearUntil = 0;
  st.poppedIdx = -1;
  if (tracker.done && st.source === 'keys') tracker.reset();
}

// キーボードで試す（スペースを押している間＝吹いている）
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && st.source === 'keys') { st.strength = 0.8; breathStart(); } }
  if (e.code === 'KeyF') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  if (e.code === 'KeyH') $('panel').classList.toggle('hidden');
});
addEventListener('keyup', (e) => { if (e.code === 'Space' && st.source === 'keys') breathEnd(); });

// ---------------- 本体 ----------------
const devices = [];
function renderDevices() {
  $('devices').innerHTML = devices.map((d) => `<li>${d.name}：${d.connected ? 'つながっている' : '切れた'}</li>`).join('');
}
$('connect').addEventListener('click', async () => {
  if (!bluetoothAvailable()) { alert('このブラウザでは Bluetooth が使えません。Chrome か Edge で開いてください。'); return; }
  const dev = new ShinkokyuDevice();
  dev.addEventListener('connect', renderDevices);
  dev.addEventListener('disconnect', renderDevices);
  dev.addEventListener('hello', async (e) => {
    try { if (e.detail.song && e.detail.song !== tracker.song.id) tracker.setSong(await loadSong(e.detail.song)); } catch {}
  });
  // 息の始まり・終わりは本体の知らせで動かす（長さも本体の値）。状態の行は、知らせを取りこぼしたときの予備
  dev.addEventListener('breathstart', (e) => { if (e.detail.kind === 'exhale') breathStart(); });
  dev.addEventListener('breathend', (e) => { if (e.detail.kind === 'exhale') breathEnd(e.detail.seconds); });
  // 本体が次の音を鳴らし始めたら、その瞬間にかたまりを1つ消す（同じ音の続きなら消さない）
  dev.addEventListener('note', (e) => {
    const next = tracker.flat[st.poppedIdx + 1];
    if (e.detail.midi > 0 && next && next.midi + 12 === e.detail.midi) { startSessionIfNeeded(); popTo(st.poppedIdx + 1); }
  });
  dev.addEventListener('status', (e) => {
    const s = e.detail;
    tracker.syncTo(s.phrase, s.note, s.waiting);
    st.strength = clamp((s.dP - 5) / 40, 0.25, 1); // 息の強さ（素の基板の値。筒ができたら見直す）
    if (s.state === 'exhale' && !st.exhaling) breathStart();
    if (s.state !== 'exhale' && st.exhaling) breathEnd();
    if (st.exhaling && !tracker.done && tracker.idx > st.poppedIdx) popTo(tracker.idx); // 知らせを取りこぼしたときの追いつき
  });
  dev.addEventListener('songdone', onSongDone);
  try {
    await dev.connect();
    devices.push(dev);
    st.source = 'device';
    tracker.reset(); st.poppedIdx = -1;
    await dev.restart(); // つないだら、本体の曲も最初から（画面と本体の位置をそろえる）
    renderDevices();
  } catch (err) {
    console.warn(err);
  }
});

// ---------------- 設定 ----------------
$('gear').addEventListener('click', () => $('panel').classList.toggle('hidden'));
$('indicator').addEventListener('click', () => { st.fogVisible = !st.fogVisible; });
$('later').addEventListener('click', () => $('banner').classList.add('hidden'));
$('fill').addEventListener('change', (e) => { st.fillMin = parseFloat(e.target.value); });
$('full').addEventListener('click', async () => {
  hideDone();
  st.acc = 1; st.notifiedFull = false; st.breaths = [];
  tracker.reset(); st.poppedIdx = -1;
  for (const d of devices) if (d.connected) await d.restart().catch(() => {});
});
$('clear').addEventListener('click', () => {
  st.acc = 0;
  [...puffs].forEach((p, i) => setTimeout(() => { if (puffs.includes(p)) pop(p); }, i * 40));
});
function addMoya() {
  const v = $('moya').value.trim();
  if (!v) return;
  // まだ言葉のない煙のうち、息の入る所からいちばん遠いものに書く。なければ新しく出す
  const [ox, oy] = ORIGIN();
  const plain = puffs.filter((p) => !p.label);
  if (plain.length) setLabel(plain.reduce((a, b) => (Math.hypot(a.x - ox, a.y - oy) > Math.hypot(b.x - ox, b.y - oy) ? a : b)), v);
  else addPuff(v);
  if (st.poppedIdx >= 0) st.sessionL++;
  $('moya').value = '';
}
$('addmoya').addEventListener('click', addMoya);
$('moya').addEventListener('keydown', (e) => { if (e.key === 'Enter') addMoya(); });

// はじめは、たまっている途中の煙を出しておく
for (let i = 0; i < Math.round(MAXP() * st.acc); i++) { const p = addPuff(); p.born -= 1000; }
window.shinkokyu = { st, view, tracker, puffs }; // 調べるとき用
requestAnimationFrame(frame);
</script>

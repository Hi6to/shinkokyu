<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>心拍数</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 11/14：発表用の心拍数の窓。いつも手前（パワポのスライドショーの上にも出る）。押しても前の画面からフォーカスを奪わない */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #box { position: absolute; inset: 0; box-sizing: border-box; background: rgba(11,13,18,0.92); border: calc(3px * var(--s)) solid #f2f4f8; outline: calc(1px * var(--s)) solid #f2f4f8; outline-offset: calc(-6px * var(--s));
         color: #f2f4f8; font-family: "DotGothic16", "MS Gothic", monospace; padding: calc(8px * var(--s)) calc(12px * var(--s)); cursor: grab; display: flex; flex-direction: column; justify-content: space-between; }
  :root { --s: 1; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: calc(14px * var(--s)); color: #a9b3c6; }
  .mid { display: flex; align-items: baseline; gap: calc(8px * var(--s)); }
  #heart { font-size: calc(30px * var(--s)); color: #ff6b6b; display: inline-block; transform-origin: center; }
  #heart.beat { animation: beat var(--beat, 1s) infinite; }
  @keyframes beat { 0% { transform: scale(1); } 12% { transform: scale(1.25); } 30% { transform: scale(1); } }
  #bpm { font-size: calc(54px * var(--s)); line-height: 1; min-width: 2.2ch; text-align: right; }
  #unit { font-size: calc(16px * var(--s)); color: #a9b3c6; }
  #delta { margin-left: auto; font-size: calc(16px * var(--s)); text-align: right; line-height: 1.3; }
  #delta b { font-weight: normal; font-size: calc(24px * var(--s)); }
  .down { color: #7fd4a8; } .up { color: #ffb35c; }
  /* 11/15：グラフは窓全体の背景に薄く描く（文字は手前） */
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  /* 11/15：大きさを変える − ・＋ ボタン（右上）。ふだんは薄く、窓の上にマウスがあるとはっきり */
  .top { gap: calc(6px * var(--s)); }
  #st { margin-left: auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sz { flex: none; }
  .sz { width: calc(22px * var(--s)); height: calc(18px * var(--s)); display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
        border: calc(1px * var(--s)) solid #a9b3c6; color: #f2f4f8; background: rgba(11,13,18,0.6); font-size: calc(14px * var(--s)); line-height: 1; cursor: pointer; opacity: 0.45; }
  #box:hover .sz { opacity: 1; }
  .sz:hover { background: #f2f4f8; color: #0b0d12; }
  .sz.press { background: #ff6b6b; color: #0b0d12; border-color: #ff6b6b; }
  .top, .mid { position: relative; z-index: 1; text-shadow: 0 0 calc(4px * var(--s)) rgba(11,13,18,0.9); }
</style>
</head>
<body>
<div id="box">
  <canvas id="bg"></canvas>
  <div class="top"><span>心拍数</span><span id="st">つないでいません</span><span class="sz" id="szDown" data-step="-1" title="小さく">−</span><span class="sz" id="szUp" data-step="1" title="大きく">＋</span></div>
  <div class="mid"><span id="heart">♥</span><span id="bpm">--</span><span id="unit">bpm</span><span id="delta"></span></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const api = window.hrApi;
let dev = null, chr = null, wanted = false, retryTimer = 0;
const hist = [];             // [{t, v}] 直近 120 秒
let base = null, baseBuf = []; // 基準（つないだ直後・リセット直後の 5 回分の平均）
function status(s, extra) { $('st').textContent = s; api.status({ text: s, bpm: hist.length ? hist[hist.length - 1].v : null, name: dev ? dev.name : '', base, ...extra }); }
function parseHR(dv) {
  const flags = dv.getUint8(0);
  return (flags & 1) ? dv.getUint16(1, true) : dv.getUint8(1);
}
function onValue(e) {
  const v = parseHR(e.target.value);
  if (!v || v < 25 || v > 230) return;
  const t = Date.now();
  hist.push({ t, v }); while (hist.length && t - hist[0].t > 120000) hist.shift();
  if (base == null) { baseBuf.push(v); if (baseBuf.length >= 5) { base = Math.round(baseBuf.reduce((a, b) => a + b, 0) / baseBuf.length); baseBuf = []; } }
  draw(v);
  api.status({ text: 'つながっています', bpm: v, name: dev ? dev.name : '', base });
}
function draw(v) {
  $('bpm').textContent = v;
  $('heart').classList.add('beat'); document.documentElement.style.setProperty('--beat', (60 / v).toFixed(2) + 's');
  if (base != null) {
    const d = v - base;
    $('delta').innerHTML = `はじめ ${base}<br><b class="${d < 0 ? 'down' : d > 0 ? 'up' : ''}">${d > 0 ? '+' : d < 0 ? '−' : '±'}${Math.abs(d)}</b>`;
  } else $('delta').textContent = '';
  drawBg();
}
// 11/15：直近 60 秒の心拍数を、窓全体の背景に薄い山の形で描く
const SPAN = 60000;
function drawBg() {
  const c = $('bg'), r = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * r) || c.height !== Math.round(h * r)) { c.width = Math.round(w * r); c.height = Math.round(h * r); }
  const g = c.getContext('2d');
  g.setTransform(r, 0, 0, r, 0, 0); g.clearRect(0, 0, w, h);
  const now = Date.now(), pts = hist.filter((p) => now - p.t <= SPAN);
  if (pts.length < 2) return;
  let lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  if (base != null) { lo = Math.min(lo, base); hi = Math.max(hi, base); }
  if (hi - lo < 16) { const m = (hi + lo) / 2; lo = m - 8; hi = m + 8; }   // 小さなゆれで大げさに見えないように
  const pad = h * 0.12;
  const X = (t) => w - ((now - t) / SPAN) * w;
  const Y = (v) => h - pad - ((v - lo) / (hi - lo)) * (h - pad * 2);
  // 基準の線（点線）
  if (base != null) {
    g.strokeStyle = 'rgba(169,179,198,0.35)'; g.lineWidth = 1; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(0, Y(base)); g.lineTo(w, Y(base)); g.stroke(); g.setLineDash([]);
  }
  // 塗り
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(255,107,107,0.30)'); grad.addColorStop(1, 'rgba(255,107,107,0.02)');
  g.beginPath(); g.moveTo(X(pts[0].t), h);
  for (const p of pts) g.lineTo(X(p.t), Y(p.v));
  g.lineTo(X(pts[pts.length - 1].t), h); g.closePath(); g.fillStyle = grad; g.fill();
  // 線
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, X(p.t), Y(p.v)));
  g.strokeStyle = 'rgba(255,107,107,0.55)'; g.lineWidth = Math.max(1.5, 2 * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1)); g.lineJoin = 'round'; g.stroke();
}
setInterval(drawBg, 1000);              // 値が来ない間も左へ流す
window.addEventListener('resize', drawBg);
async function attach() {
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService('heart_rate');
  chr = await svc.getCharacteristic('heart_rate_measurement');
  chr.addEventListener('characteristicvaluechanged', onValue);
  await chr.startNotifications();
  status('つながっています');
}
function retry() {
  clearTimeout(retryTimer);
  if (!wanted || !dev) return;
  status('つなぎ直しています…');
  retryTimer = setTimeout(async () => { try { await attach(); } catch (e) { retry(); } }, 3000);
}
// アプリ（main.js）から、ユーザー操作の扱いで呼ばれる
window.hrConnect = async function () {
  try {
    status('心拍計を探しています…');
    const d = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    if (dev && dev !== d) { try { dev.gatt.disconnect(); } catch {} }
    dev = d; wanted = true;
    dev.addEventListener('gattserverdisconnected', () => { $('heart').classList.remove('beat'); retry(); });
    await attach();
  } catch (e) {
    status(dev && dev.gatt && dev.gatt.connected ? 'つながっています' : '見つかりませんでした');
    api.log('hr_connect_fail', { msg: String(e && e.message || e).slice(0, 120) });
  }
};
window.hrDisconnect = function () { wanted = false; clearTimeout(retryTimer); if (dev) { try { dev.gatt.disconnect(); } catch {} } dev = null; $('heart').classList.remove('beat'); $('bpm').textContent = '--'; $('delta').textContent = ''; hist.length = 0; drawBg(); status('つないでいません'); };
window.hrResetBase = function () { base = null; baseBuf = []; $('delta').textContent = '基準を取り直し中…'; api.status({ text: $('st').textContent, bpm: hist.length ? hist[hist.length - 1].v : null, name: dev ? dev.name : '', base: null }); };
window.hrScale = function (s) { document.documentElement.style.setProperty('--s', String(s)); requestAnimationFrame(() => { drawBg(); sendBtns(); }); };
// 11/15：− ・＋ ボタン。場所をアプリに知らせておく（押したのがページに届かないときは、アプリの側が場所から判断する）
function sendBtns() {
  api.btns([...document.querySelectorAll('.sz')].map((b) => { const r = b.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, step: Number(b.dataset.step) }; }));
}
function flash(b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 180); }
for (const b of document.querySelectorAll('.sz')) {
  b.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); flash(b); api.size(Number(b.dataset.step)); });
}
window.hrFlashBtn = function (step) { const b = document.querySelector(`.sz[data-step="${step}"]`); if (b) flash(b); };
window.addEventListener('resize', sendBtns);
document.fonts && document.fonts.ready.then(sendBtns);
sendBtns();
// つかんで動かす（動かすのはアプリの側。押しても前の画面のフォーカスは変わらない）
let drag = null;
$('box').addEventListener('pointerdown', (e) => { $('box').setPointerCapture(e.pointerId); drag = { sx: e.screenX, sy: e.screenY, started: false }; });
$('box').addEventListener('pointermove', (e) => { if (!drag || drag.started) return; if (Math.hypot(e.screenX - drag.sx, e.screenY - drag.sy) < 4) return; drag.started = true; api.drag('start'); });
$('box').addEventListener('pointerup', () => { if (drag && drag.started) api.drag('end'); drag = null; });
for (const ev of ['pointercancel', 'lostpointercapture']) $('box').addEventListener(ev, () => { if (drag && drag.started) api.drag('end'); drag = null; });
api.onScale((s) => window.hrScale(s));
</script>
</body>
</html>

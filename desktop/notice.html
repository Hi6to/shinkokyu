<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シン呼吸 火の子のお知らせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 右の吹き出し（LINE の通知のように下から積む）。見た目は煙メーターと同じ黒い箱＋白い二重の枠。マウスは素通り */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: "DotGothic16", "MS Gothic", monospace; color: #f2f4f8; }
  #stack { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 6px 8px; }
  .toast { position: relative; display: flex; gap: 10px; align-items: flex-start; background: rgba(11, 13, 18, 0.92); border: 2px solid #f2f4f8; outline: 1px solid #f2f4f8; outline-offset: 2px; padding: 8px 10px 9px; margin: 3px; }
  .toast canvas { width: 40px; height: 40px; flex: none; image-rendering: pixelated; }
  .head { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: #a9b3c6; margin-bottom: 2px; }
  .head b { color: #f2f4f8; font-weight: normal; font-size: 13px; }
  .text { font-size: 15px; line-height: 1.55; min-height: 1.55em; white-space: pre-wrap; word-break: break-all; }
  .text .ch { display: inline-block; animation: shu 0.12s steps(2) 1; }          /* 1文字ずつ「シュッ」と入る */
  .text .em { color: #ffe08a; }                                                    /* 大事な所だけ少し色 */
  @keyframes shu { 0% { transform: translateX(7px); color: #ffffff; text-shadow: -4px 0 0 rgba(242, 244, 248, 0.6); } 100% { transform: none; } }
  .toast.in { animation: slidein 0.18s steps(3) 1; }                                /* 右から、カクッカクッと3段で入る */
  @keyframes slidein { 0% { transform: translateX(110%); } 100% { transform: none; } }
  .toast.out { animation: blink 0.36s steps(1) 3; }                                 /* 消えるときは、まるごと点滅 */
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  /* 11/11 発表用（大きいとき）：横に長く、縦を短く。見出しの行をなくして名前は文の頭に、行は区切らずに横へ流す */
  body.wide .head { display: none; }
  body.wide .toast { padding: 6px 12px 7px; align-items: center; }
  body.wide .text { line-height: 1.45; }
  body.wide .who { color: #a9b3c6; margin-right: 0.5em; }
  body.wide .sep { display: inline-block; width: 1em; }
  body.wide .ph { white-space: pre; }   /* 1行ぶんは折り返さない（間の空白はそのまま） */
  .text .ch.hid { visibility: hidden; animation: none; }   /* まだ打っていない文字（場所だけ先にとっておく：高さが先に分かる） */
  .cursor { display: inline-block; width: 0.55em; height: 1em; background: #f2f4f8; vertical-align: -0.12em; margin-left: 1px; animation: cur 0.5s steps(1) infinite; }
  @keyframes cur { 50% { opacity: 0; } }
  /* 11/12 夜：右上の ×（すぐ消す）。右下の火の子の × と同じく、マウスを乗せたときだけ出る */
  .x { position: absolute; top: -2px; right: 2px; font: inherit; font-size: 16px; padding: 0 4px; background: none; border: none; color: #f2f4f8; cursor: pointer; display: none; }
  .toast:hover .x { display: block; }
  .x:hover { color: #ff8a7a; }
</style>
</head>
<body>
<div id="stack"></div>
<script src="hinoko.js"></script>
<script>
  // 吹き出しを1つ出す：{ lines: ['…', '…'], name: '火の子', stage, mood, life }
  // 文字は1文字ずつ（28ms）出す。「〔…〕」でかこった所は少し色をつける
  let MAX = 3;
  const stack = document.getElementById('stack');
  const live = new Set();
  const READ_MS = 7000; // 11/11：2秒 → 7秒（もう少し長く読めるように）
  function add(n) {
    // 大きさ（11/11）：アプリの設定に合わせて、ページごと拡大する。大きいときは、同時に出すのを2つまでにする（窓に収まるように）
    const sc = n.scale || 1; wantZoom = sc; MAX = sc >= 2 ? 2 : 3;
    document.body.classList.toggle('wide', sc >= 2);
    while (stack.children.length >= MAX) remove(stack.firstElementChild, true);
    const el = document.createElement('div');
    el.className = 'toast in';
    const cv = document.createElement('canvas'); cv.width = 40; cv.height = 40;
    const body = document.createElement('div'); body.style.flex = '1';
    body.innerHTML = `<div class="head"><b>${n.name || '火の子'}</b><span>いま</span></div><div class="text"></div>`;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'この知らせを消す';
    x.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); remove(el, true); }); // 押した瞬間に消す（離すのを待たない）
    el.append(cv, body, x); stack.append(el);
    const icon = { cv, stage: n.stage || 0, mood: n.mood || 'idle' };
    live.add(icon); el._icon = icon;
    const wide = sc >= 2;
    if (wide) body.querySelector('.text').innerHTML = `<span class="who">${n.name || '火の子'}</span>`;
    type(body.querySelector('.text'), (n.lines || []).filter(Boolean).join(wide ? '\t' : '\n'), () => {
      // 11/12：時間では消さない（マウスを動かしたときだけ消す）。見ていない間に消えて読めなかった、を防ぐ。
      //   ただし見本（デモ）の間は、今までどおり時間でも消す（発表中はマウスを動かさないので、たまっていかないように）
      if (!n.sticky) { const life = n.life || 6000 + [...(n.lines || []).join('')].length * 80; el._timer = setTimeout(() => remove(el), life); }
      el._readyAt = performance.now() + READ_MS; // 文字が出きってから少しの間は、マウスを動かしても消さない（出た瞬間に消えて読めない、を防ぐ）
    });
  }
  function type(box, text, done) {
    const parts = [];   // [文字, 色つきか]
    let em = false;
    for (const ch of text) { if (ch === '〔') { em = true; continue; } if (ch === '〕') { em = false; continue; } parts.push([ch, em]); }
    // 文字は先に全部置いて（見えない）、1文字ずつ見せる。高さが最初から決まるので、窓に収まる大きさを先に決められる
    // 発表用（行を横へ流すとき）：1行ぶんの言葉はまとめて、途中では折り返さない
    let ph = null;
    const els = parts.map(([ch, e]) => {
      if (ch === '\n') { ph = null; const br = document.createElement('br'); box.append(br); return br; }
      const s = document.createElement('span');
      if (ch === '\t') { ph = null; s.className = 'sep'; box.append(s); return s; }   // 行の区切り（少し空ける）
      s.className = 'ch hid' + (e ? ' em' : ''); s.textContent = ch;
      if (document.body.classList.contains('wide')) { if (!ph) { ph = document.createElement('span'); ph.className = 'ph'; box.append(ph); } ph.append(s); }
      else box.append(s);
      return s;
    });
    fit();
    const cur = document.createElement('span'); cur.className = 'cursor';
    let i = 0;
    const step = () => {
      if (i >= parts.length) { cur.remove(); done(); return; }
      const ch = parts[i][0], el = els[i++];
      el.classList.remove('hid'); el.after(cur);
      setTimeout(step, ch === '\n' || ch === '\t' ? 140 : /[、。！？ ]/.test(ch) ? 90 : 28);
    };
    step();
  }
  function remove(el, now) {
    if (!el || el._gone) return;
    el._gone = true; clearTimeout(el._timer); live.delete(el._icon);
    if (now) { el.remove(); report(); return; }
    el.classList.remove('in'); el.classList.add('out');
    setTimeout(() => { el.remove(); report(); }, 1080);
  }
  function report() { if (!stack.children.length) window.noticeApi.empty(); }
  // 窓に収まる大きさにする：設定の大きさ（wantZoom）から始めて、吹き出しの山が窓の高さに収まるまで少しずつ小さくする（11/11）
  let wantZoom = 1;
  function fit() {
    const html = document.documentElement;
    let z = wantZoom;
    html.style.zoom = z;
    while (z > 0.8 && stack.getBoundingClientRect().height * zoomFactor(z) > window.innerHeight - 2) { z = Math.round((z - 0.05) * 100) / 100; html.style.zoom = z; }
  }
  // 見かけの高さに直す係数：getBoundingClientRect がページの拡大を含んだ値を返すか（Chromium の版で変わる）を、その場で測って決める
  function zoomFactor(z) {
    const t = document.createElement('div'); t.style.cssText = 'position:absolute;top:0;height:100px;visibility:hidden'; document.body.append(t);
    const h = t.getBoundingClientRect().height; t.remove();
    return z / (h / 100);
  }
  // 顔のドット絵を動かす（ゆれ）
  setInterval(() => { const t = performance.now(); for (const ic of live) window.drawHinoko(ic.cv, { stage: ic.stage, mood: ic.mood, t, span: 20 }); }, 110);
  // 11/12 夜：この窓はふだんマウスを素通りさせている（下の画面を押せるように）。吹き出しの上にマウスが来たときだけ、押せるようにする
  // 11/13：吹き出しのある場所（窓の中の位置）を、アプリへ知らせ続ける。アプリがマウスの位置を見て、吹き出しの上にあるときだけ押せる窓にする
  //   （前は、この窓に「マウスの動きだけ受けとる」設定をしていたが、Windows で、かくれている間もその場所のクリックを横取りし、
  //     下にある右下の火の子の × が押せなくなった）
  let lastRects = '';
  setInterval(() => {
    const f = zoomFactor(parseFloat(document.documentElement.style.zoom) || 1);
    const rects = [...stack.children].filter((el) => !el._gone).map((el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left * f), y: Math.round(r.top * f), w: Math.round(r.width * f), h: Math.round(r.height * f) }; });
    const key = JSON.stringify(rects);
    if (key !== lastRects) { lastRects = key; window.noticeApi.rects(rects); }
  }, 200);
  window.noticeApi.onToast(add);
  // 11/13：× を押しても、この窓に「押した」が届かないことがある（火の子の窓と同じ）。アプリが PC 全体のマウスを見て、× の所が押されたら位置を知らせてくる
  //   その位置にある吹き出しを消す（もう消えている吹き出しは数えないので、ページの × でも消えたときに、別の吹き出しまで消すことはない）
  if (window.noticeApi.onCloseAt) window.noticeApi.onCloseAt((pt) => {
    const f = zoomFactor(parseFloat(document.documentElement.style.zoom) || 1);
    for (const el of [...stack.children]) {
      if (el._gone) continue;
      const r = el.getBoundingClientRect();
      if (pt.x >= r.left * f - 4 && pt.x <= r.right * f + 4 && pt.y >= r.top * f - 4 && pt.y <= r.bottom * f + 4) { remove(el, true); break; }
    }
  });
  window.noticeApi.onClear(() => { for (const el of [...stack.children]) remove(el, true); }); // 大きさを変えたとき：前の吹き出しを消す
  // 11/11：マウスを動かしたら、読める時間がたった吹き出しは消す（「一服おわり」「おかえり」など）
  window.noticeApi.onMouse(() => { const t = performance.now(); for (const el of [...stack.children]) if (el._readyAt && t >= el._readyAt) remove(el); });
</script>
</body>
</html>
